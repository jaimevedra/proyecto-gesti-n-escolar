<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE - Asignaturas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition duration-300">

    <!-- Barra de navegación -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-xl p-2">
                    <svg width="24" height="24" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 10C24 10 14 7 6 10V38C14 35 24 38 24 38C24 38 34 35 42 38V10C34 7 24 10 24 10Z" fill="white" fill-opacity="0.15"/>
                        <path d="M24 10V38" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        <path d="M6 10C14 7 24 10 24 10V38C14 35 6 38 6 38V10Z" fill="white" fill-opacity="0.3"/>
                        <path d="M42 10C34 7 24 10 24 10V38C34 35 42 38 42 38V10Z" fill="white" fill-opacity="0.2"/>
                    </svg>
                </div>
                <span class="font-bold text-gray-800 dark:text-white text-lg">SGE</span>
            </a>
        </div>
        <div class="flex items-center gap-4">
            <a href="perfil.html" id="nombreProfesor" class="text-gray-600 dark:text-gray-300 text-sm hover:text-blue-600 transition duration-150"></a>
            <button onclick="cerrarSesion()" class="text-sm text-red-500 hover:text-red-700 font-medium">
                Cerrar sesión
            </button>
            <button onclick="toggleModo()" class="bg-gray-100 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl p-2 hover:shadow-md transition duration-200">
                <svg id="iconoSol" width="18" height="18" fill="none" stroke="#374151" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg id="iconoLuna" class="hidden" width="18" height="18" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="max-w-4xl mx-auto px-6 py-8">

        <!-- Bloqueo para no-rectores -->
        <div id="bloqueoAcceso" class="hidden bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-10 text-center">
            <div class="text-5xl mb-4">🔒</div>
            <h1 class="text-xl font-bold text-gray-800 dark:text-white">Acceso restringido</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-2">Solo el rector puede gestionar asignaturas</p>
            <a href="dashboard.html" class="inline-block mt-4 text-blue-600 hover:text-blue-700 font-medium">Volver al dashboard</a>
        </div>

        <!-- Contenido principal -->
        <div id="contenidoPrincipal" class="hidden">

            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Asignaturas</h1>
                    <p class="text-gray-500 dark:text-gray-400 mt-1">Gestiona las asignaturas del colegio</p>
                </div>
                <button onclick="mostrarFormulario()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-xl transition duration-200">
                    + Nueva asignatura
                </button>
            </div>

            <!-- Formulario nueva asignatura -->
            <div id="formulario" class="hidden bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 mb-6">
                <h2 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">Nueva asignatura</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nombre</label>
                        <input type="text" id="nombreAsignatura" placeholder="Ej: Matemáticas"
                            class="w-full border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-2.5 text-gray-800 dark:text-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Descripción (opcional)</label>
                        <input type="text" id="descripcionAsignatura" placeholder="Breve descripción"
                            class="w-full border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-2.5 text-gray-800 dark:text-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="flex gap-3 mt-4">
                    <button onclick="crearAsignatura()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-xl transition duration-200">
                        Guardar
                    </button>
                    <button onclick="ocultarFormulario()" class="bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 text-gray-700 dark:text-gray-300 font-semibold px-5 py-2.5 rounded-xl transition duration-200">
                        Cancelar
                    </button>
                </div>
                <div id="mensajeError" class="hidden mt-3 bg-red-50 text-red-600 text-sm rounded-xl px-4 py-3"></div>
                <div id="mensajeExito" class="hidden mt-3 bg-green-50 text-green-600 text-sm rounded-xl px-4 py-3"></div>
            </div>

            <!-- Lista de asignaturas -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                <div class="p-6 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between">
                    <h2 class="text-lg font-semibold text-gray-800 dark:text-white">Lista de asignaturas</h2>
                    <span id="totalAsignaturas" class="text-sm text-gray-500 dark:text-gray-400"></span>
                </div>
                <div id="listaAsignaturas" class="divide-y divide-gray-100 dark:divide-gray-700">
                    <div class="p-6 text-center text-gray-500 dark:text-gray-400">Cargando...</div>
                </div>
            </div>

        </div>

    </main>

    <script>
        const token = localStorage.getItem('token');
        const nombre = localStorage.getItem('nombre');
        const apellido = localStorage.getItem('apellido');
        const rolActual = localStorage.getItem('rol');

        if (!token) window.location.href = 'login.html';

        document.getElementById('nombreProfesor').textContent = `${nombre} ${apellido}`;

        if (rolActual === 'rector') {
            document.getElementById('contenidoPrincipal').classList.remove('hidden');
            cargarAsignaturas();
        } else {
            document.getElementById('bloqueoAcceso').classList.remove('hidden');
        }

        async function cargarAsignaturas() {
            try {
                const res = await fetch('http://127.0.0.1:8000/materias/colegio/1', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const materias = await res.json();
                const lista = document.getElementById('listaAsignaturas');
                const total = document.getElementById('totalAsignaturas');

                total.textContent = `${materias.length} asignatura(s)`;

                if (materias.length === 0) {
                    lista.innerHTML = '<div class="p-6 text-center text-gray-500 dark:text-gray-400">No hay asignaturas registradas</div>';
                    return;
                }

                lista.innerHTML = materias.map(m => `
                    <div class="p-4 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-700 transition duration-150">
                        <div class="flex items-center gap-4">
                            <div class="bg-green-100 dark:bg-green-900 rounded-xl w-10 h-10 flex items-center justify-center">
                                <svg width="18" height="18" fill="none" stroke="#16A34A" stroke-width="2" viewBox="0 0 24 24">
                                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                                </svg>
                            </div>
                            <div>
                                <p class="font-medium text-gray-800 dark:text-white">${m.nombre}</p>
                                <p class="text-sm text-gray-500 dark:text-gray-400">${m.descripcion || 'Sin descripción'}</p>
                            </div>
                        </div>
                        <span class="text-xs bg-green-50 dark:bg-green-900 text-green-600 dark:text-green-300 px-3 py-1 rounded-full">Activa</span>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function crearAsignatura() {
            const nombreVal = document.getElementById('nombreAsignatura').value;
            const descripcionVal = document.getElementById('descripcionAsignatura').value;
            const errorDiv = document.getElementById('mensajeError');
            const exitoDiv = document.getElementById('mensajeExito');

            if (!nombreVal) {
                errorDiv.textContent = 'El nombre es obligatorio';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('http://127.0.0.1:8000/materias/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        colegio_id: 1,
                        nombre: nombreVal,
                        descripcion: descripcionVal || null
                    })
                });

                if (!res.ok) {
                    errorDiv.textContent = 'Error al crear la asignatura';
                    errorDiv.classList.remove('hidden');
                    return;
                }

                exitoDiv.textContent = 'Asignatura creada correctamente';
                exitoDiv.classList.remove('hidden');
                errorDiv.classList.add('hidden');

                document.getElementById('nombreAsignatura').value = '';
                document.getElementById('descripcionAsignatura').value = '';

                setTimeout(() => {
                    ocultarFormulario();
                    cargarAsignaturas();
                }, 1500);

            } catch (error) {
                errorDiv.textContent = 'Error al conectar con el servidor';
                errorDiv.classList.remove('hidden');
            }
        }

        function mostrarFormulario() {
            document.getElementById('formulario').classList.remove('hidden');
        }

        function ocultarFormulario() {
            document.getElementById('formulario').classList.add('hidden');
            document.getElementById('mensajeError').classList.add('hidden');
            document.getElementById('mensajeExito').classList.add('hidden');
        }

        function cerrarSesion() {
            localStorage.removeItem('token');
            localStorage.removeItem('nombre');
            localStorage.removeItem('apellido');
            localStorage.removeItem('rol');
            localStorage.removeItem('grado_asignado');
            localStorage.removeItem('profesorId');
            window.location.href = 'login.html';
        }

        function toggleModo() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            document.getElementById('iconoSol').classList.toggle('hidden');
            document.getElementById('iconoLuna').classList.toggle('hidden');
            localStorage.setItem('modo', html.classList.contains('dark') ? 'dark' : 'light');
        }

        if (localStorage.getItem('modo') === 'dark') {
            document.documentElement.classList.add('dark');
            document.getElementById('iconoSol').classList.add('hidden');
            document.getElementById('iconoLuna').classList.remove('hidden');
        }
    </script>

</body>
</html>
